# EU AI Act 合规检查工作流
# 文件位置: .github/workflows/eu-ai-act-compliance.yml
# 触发条件: PR + 每周定期扫描

name: EU AI Act Compliance Check

on:
  pull_request:
    paths:
      - '.agents/**'
      - '**/*.py'
      - '**/*.ts'
      - '**/*.js'
  schedule:
    - cron: '0 8 * * 1'  # 每周一 08:00 UTC
  workflow_dispatch:  # 手动触发

env:
  # 合规分数阈值 (0-100)
  COMPLIANCE_THRESHOLD: 90

jobs:
  compliance-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ============================================================
      # Step 1: 验证 .agents/ 目录完整性
      # ============================================================
      - name: Verify .agents/ integrity
        id: verify-agents
        run: |
          echo "::group::🔍 检查 .agents/ 目录结构"
          echo "📅 检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📂 工作目录: $(pwd)"
          echo ""

          # 检查 .agents/ 目录是否存在
          if [ -d ".agents" ]; then
            echo "✅ .agents/ 目录存在"
            echo "📋 目录结构:"
            find .agents -type f -name "*.py" -o -name "*.toml" -o -name "*.md" | head -20
          else
            echo "⚠️ .agents/ 目录不存在，跳过检查"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"

          if [ -f ".agents/scripts/check_constraints.py" ]; then
            echo "::group::🔧 执行约束检查脚本"
            uv run .agents/scripts/check_constraints.py 2>&1 | tee constraints-check.log
            EXIT_CODE=${PIPESTATUS[0]}
            echo ""
            echo "📊 检查结果: 退出码=$EXIT_CODE"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ 约束检查通过"
            else
              echo "⚠️ 约束检查发现问题，请查看上方日志"
            fi
            echo "::endgroup::"
          else
            echo "⚠️ check_constraints.py 脚本不存在"
          fi
        continue-on-error: true

      # ============================================================
      # Step 2: EU AI Act 合规检查
      # ============================================================
      - name: Run EU AI Act compliance check
        id: eu-ai-act-check
        run: |
          echo "::group::🇪🇺 EU AI Act 合规检查"
          echo "📅 检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          if [ -f ".agents/scripts/check_eu_ai_act.py" ]; then
            echo "🔧 执行 EU AI Act 检查脚本..."
            uv run .agents/scripts/check_eu_ai_act.py 2>&1 | tee eu-ai-act-check.log
            EXIT_CODE=${PIPESTATUS[0]}
            echo ""
            echo "📊 检查结果: 退出码=$EXIT_CODE"

            # 解析检查结果
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ EU AI Act 合规检查通过"
              echo "status=passed" >> $GITHUB_OUTPUT
            else
              echo "❌ EU AI Act 合规检查失败"
              echo "status=failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ check_eu_ai_act.py 脚本不存在"
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"
        continue-on-error: true

      # ============================================================
      # Step 3: Inkog 合规扫描 (可选，需安装 CLI)
      # 取消下方注释以启用完整扫描
      # ============================================================
      # - name: Install Inkog CLI
      #   run: |
      #     echo "::group::📦 安装 Inkog CLI"
      #     npm install -g @inkog/cli
      #     inkog --version
      #     echo "::endgroup::"
      #
      # - name: Run Inkog compliance scan
      #   id: inkog-scan
      #   run: |
      #     echo "::group::🔬 执行 Inkog 合规扫描"
      #     echo "📅 扫描时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      #     echo "📋 扫描策略: eu-ai-act"
      #     echo ""
      #     inkog verify . --policy eu-ai-act --output json > compliance-report.json 2>&1
      #     cat compliance-report.json
      #     echo "::endgroup::"
      #
      # - name: Check compliance threshold
      #   run: |
      #     echo "::group::📊 检查合规分数阈值"
      #     SCORE=$(jq '.governance_score' compliance-report.json)
      #     THRESHOLD=${{ env.COMPLIANCE_THRESHOLD }}
      #     echo "当前分数: $SCORE"
      #     echo "阈值: $THRESHOLD"
      #     echo ""
      #     if [ "$SCORE" -lt $THRESHOLD ]; then
      #       echo "::error::合规分数 $SCORE 低于阈值 $THRESHOLD"
      #       exit 1
      #     fi
      #     echo "✅ 合规分数达标: $SCORE"
      #     echo "::endgroup::"

      # ============================================================
      # Step 4: 生成合规报告
      # ============================================================
      - name: Generate compliance report
        id: generate-report
        run: |
          echo "::group::📝 生成合规报告"
          REPORT_FILE="compliance-report.json"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # 收集检查结果
          CONSTRAINTS_RESULT="unknown"
          EU_AI_ACT_RESULT="${{ steps.eu-ai-act-check.outputs.status }}"

          if [ -f "constraints-check.log" ]; then
            if grep -q "✅" constraints-check.log; then
              CONSTRAINTS_RESULT="passed"
            else
              CONSTRAINTS_RESULT="warning"
            fi
          fi

          # 生成 JSON 报告
          cat > $REPORT_FILE << EOF
          {
            "metadata": {
              "timestamp": "$TIMESTAMP",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}"
            },
            "checks": {
              "constraints_check": {
                "status": "$CONSTRAINTS_RESULT",
                "script": ".agents/scripts/check_constraints.py"
              },
              "eu_ai_act_check": {
                "status": "$EU_AI_ACT_RESULT",
                "script": ".agents/scripts/check_eu_ai_act.py"
              },
              "inkog_scan": {
                "status": "disabled",
                "note": "Enable Inkog CLI for actual scanning"
              }
            },
            "governance_score": 0,
            "threshold": ${{ env.COMPLIANCE_THRESHOLD }},
            "status": "placeholder",
            "note": "Enable Inkog CLI for actual governance score calculation"
          }
          EOF

          echo "📄 报告文件: $REPORT_FILE"
          echo "📊 报告内容:"
          cat $REPORT_FILE | jq '.'
          echo "::endgroup::"

          # 设置输出
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT

      # ============================================================
      # Step 5: 上传报告
      # ============================================================
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: |
            compliance-report.json
            constraints-check.log
            eu-ai-act-check.log
          retention-days: 90

      # ============================================================
      # Step 6: 输出检查摘要
      # ============================================================
      - name: Output check summary
        if: always()
        run: |
          echo "::group::📋 检查摘要"
          echo "=========================================="
          echo "       EU AI Act 合规检查摘要"
          echo "=========================================="
          echo ""
          echo "📅 执行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌿 分支: ${{ github.ref_name }}"
          echo "📝 提交: ${{ github.sha }}"
          echo ""
          echo "📊 检查结果:"
          echo "  - 约束检查: ${{ steps.verify-agents.outcome }}"
          echo "  - EU AI Act: ${{ steps.eu-ai-act-check.outputs.status || 'unknown' }}"
          echo "  - Inkog 扫描: disabled"
          echo ""
          echo "📁 产物:"
          echo "  - compliance-report.json"
          echo "  - constraints-check.log"
          echo "  - eu-ai-act-check.log"
          echo ""
          echo "=========================================="
          echo "::endgroup::"

      # ============================================================
      # Step 7: PR 评论
      # ============================================================
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = {
              success: '✅',
              failure: '❌',
              skipped: '⏭️',
              warning: '⚠️'
            };

            const constraintsStatus = '${{ steps.verify-agents.outcome }}' === 'success' ? '✅ 通过' : '⚠️ 需关注';
            const euAiActStatus = '${{ steps.eu-ai-act-check.outputs.status }}' || 'unknown';
            const euAiActIcon = euAiActStatus === 'passed' ? '✅' : euAiActStatus === 'failed' ? '❌' : '⚠️';

            const body = `## 🇪🇺 EU AI Act 合规检查

            | 检查项 | 状态 |
            |--------|------|
            | 约束检查 | ${constraintsStatus} |
            | EU AI Act 检查 | ${euAiActIcon} ${euAiActStatus} |
            | Inkog 扫描 | ⏭️ 未启用 |

            > 📅 执行时间: \`${new Date().toISOString()}\`
            > 📝 提交: \`${{ github.sha }}\`

            ⚠️ 完整合规扫描需要启用 Inkog CLI

            📁 详细报告请查看 **Artifacts**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================================
  # Job 2: 安全漏洞扫描 (可选)
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: compliance-scan
    # 仅在 main 分支或手动触发时运行
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Output Trivy scan summary
        if: always()
        run: |
          echo "::group::🔍 Trivy 扫描结果"
          echo "📅 扫描时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📊 退出码: ${{ steps.trivy-scan.outcome }}"
          if [ -f "trivy-results.sarif" ]; then
            echo "📄 SARIF 报告已生成"
            echo "发现的问题数: $(jq '.runs[0].results | length' trivy-results.sarif 2>/dev/null || echo 'N/A')"
          fi
          echo "::endgroup::"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
